<main id="integrated-core-ideas-quiz-main" class="hidden">
    <section id="integrated-core-ideas" class="active">
        <div class="core-ideas-header">
            <h2>핵심 아이디어</h2>

            <div
                class="core-ideas-controls"
                role="group"
                aria-label="핵심 아이디어 모드 설정"
            >
                <div class="core-idea-mode-toggle">
                    <span class="core-idea-mode-label">전체</span>
                    <label class="core-idea-switch">
                        <input
                            id="core-idea-mode-toggle"
                            type="checkbox"
                            aria-label="부분 모드 켜기"
                        />
                        <span class="core-idea-switch-track" aria-hidden="true">
                            <span class="core-idea-switch-knob"></span>
                        </span>
                    </label>
                    <span class="core-idea-mode-label">부분</span>
                </div>
                <button
                    id="core-idea-settings-toggle"
                    class="btn core-idea-settings-toggle"
                    type="button"
                    aria-controls="core-ideas-grid"
                    aria-pressed="false"
                >
                    빈칸 설정
                </button>
                <button
                    id="core-idea-settings-reset"
                    class="btn core-idea-settings-reset"
                    type="button"
                    hidden
                >
                    기본값
                </button>
            </div>
        </div>

        <p id="core-idea-settings-help" class="sr-only">
            빈칸으로 만들 구절을 드래그하거나 Shift와 화살표 키로 선택하세요.
        </p>
        <p
            id="core-idea-settings-status"
            class="sr-only"
            aria-live="polite"
        ></p>

        <div id="core-ideas-grid" class="core-ideas-grid">
            <article class="core-idea-card" data-group data-ignore-order>
                <h3>우리는 누구로 살아갈까</h3>
                <div class="core-idea-entries">
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 내가 누구인지 생각하며 생활한다"
                        data-core-idea-label="우리는 누구로 살아갈까 첫 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 서로 관계를 맺으며 생활한다"
                        data-core-idea-label="우리는 누구로 살아갈까 두 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                </div>
            </article>
            <article class="core-idea-card" data-group data-ignore-order>
                <h3>우리는 어디서 살아갈까</h3>
                <div class="core-idea-entries">
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 여러 공동체 속에서 생활한다"
                        data-core-idea-label="우리는 어디서 살아갈까 첫 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 삶의 공간을 넓히며 생활한다"
                        data-core-idea-label="우리는 어디서 살아갈까 두 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                </div>
            </article>
            <article class="core-idea-card" data-group data-ignore-order>
                <h3>우리는 지금 어떻게 살아갈까</h3>
                <div class="core-idea-entries">
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 여러 유형의 주기로 생활한다"
                        data-core-idea-label="우리는 지금 어떻게 살아갈까 첫 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 과거, 현재, 미래를 생각하며 생활한다"
                        data-core-idea-label="우리는 지금 어떻게 살아갈까 두 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                </div>
            </article>
            <article class="core-idea-card" data-group data-ignore-order>
                <h3>우리는 무엇을 하며 살아갈까</h3>
                <div class="core-idea-entries">
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 경험하고 상상하고 만들며 생활한다"
                        data-core-idea-label="우리는 무엇을 하며 살아갈까 첫 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                    <div
                        class="core-idea-entry"
                        data-core-idea-row
                        data-core-idea-answer="우리는 느끼고 생각하고 표현하며 생활한다"
                        data-core-idea-label="우리는 무엇을 하며 살아갈까 두 번째 핵심 아이디어"
                    >
                        <div
                            class="core-idea-prompt"
                            data-core-idea-prompt
                        ></div>
                    </div>
                </div>
            </article>
        </div>
    </section>
</main>
